name: Release 091五笔

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号 (如 v1.0.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

env:
  CI_NAME: Release CI
jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      BUILD_ABI: armeabi-v7a,arm64-v8a,x86,x86_64
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 25
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "cmake;3.31.6"

      # 固定签名：密钥存在仓库 Secrets（本地备份在 ~/.keystores/trime091/）。
      # 以前每次临时生成新密钥，各版本签名不同，手机上没法覆盖升级。
      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TRIME091_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TRIME091_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "缺少 TRIME091_KEYSTORE_BASE64"; exit 1; }
          cat << EOF > keystore.properties
          keyBase64=$KEYSTORE_BASE64
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=trime091
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Calculate JNI cache hash
        id: cache-hash
        run: |
          ./gradlew :app:calculateNativeCacheHash

      - name: Fetch JNI cache
        uses: actions/cache@v6
        id: jni-cache
        with:
          path: "app/prebuilt"
          key: ${{ runner.os }}-trime-jni-release-${{ steps.cache-hash.outputs.native-cache-hash }}

      - name: Fetch submodules
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        run: |
          git submodule update --init --recursive

      - name: Build release Trime
        run: |
          make release

      - name: Add JNI cache
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        run: cp -R app/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib app/prebuilt

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.tag }}
          name: "Trime 091五笔 ${{ github.event.inputs.tag }}"
          artifacts: "app/build/outputs/apk/release/*.apk"
          body: |
            ## Trime + 091五笔（点儿词库2026夏）

            内置091五笔输入方案，安装即用，无需手动导入词库。

            - 词条数：227,563（含 3,764 条 z 词条）
            - 词库来源：点儿词库2026夏
            - 默认键盘主题：标准（tongwenfeng）
            - 基于 [osfans/trime](https://github.com/osfans/trime) v3.3.12
            - 从 v1.0.x 升级需先卸载旧版（旧版每次打包签名都不同）；从本版起签名固定，以后可直接覆盖升级
            - 用户目录改为在设置里选择文件夹（SAF），选原来的 rime 文件夹即可导入自定义配置

            ### 下载说明
            - `arm64-v8a`：大多数现代安卓手机
            - `armeabi-v7a`：老款安卓手机
            - `x86_64` / `x86`：模拟器
          token: ${{ secrets.GITHUB_TOKEN }}
